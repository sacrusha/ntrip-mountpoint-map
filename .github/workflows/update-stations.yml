name: Update NTRIP station data

on:
  schedule:
    # Every hour on the hour (UTC). GitHub may delay or skip runs under load.
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: update-stations
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch sourcetables and refresh stations.json
        run: python scripts/fetch_stations.py

      - name: Commit changes if any
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain data/)" ]]; then
            echo "No changes to data/; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          rtk=$(python -c "import json; d=json.load(open('data/stations.json')); print(len(d['sources'].get('rtk2go',{}).get('stations',[])))")
          cp=$(python -c  "import json; d=json.load(open('data/stations.json')); print(len(d['sources'].get('centipede',{}).get('stations',[])))")
          git commit -m "chore(data): refresh NTRIP stations (${rtk} rtk2go, ${cp} centipede)"
          git push origin HEAD:${GITHUB_REF_NAME}
