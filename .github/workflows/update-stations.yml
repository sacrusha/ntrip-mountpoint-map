name: Update NTRIP station data

on:
  schedule:
    # Four times a day: 01:00, 07:00, 13:00, 19:00 UTC.
    - cron: "0 1,7,13,19 * * *"
  workflow_dispatch:

concurrency:
  group: update-stations
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Opt in to Node.js 24 for JS-based actions ahead of the June 2026 switch.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch sourcetables and refresh stations.json
        run: python scripts/fetch_stations.py

      - name: Commit changes if any
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain data/)" ]]; then
            echo "No changes to data/; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet -- data/stations.json; then
            git commit -m "chore(pipeline): heartbeat — refresh source health timestamps"
          else
            rtk=$(python -c "import json; d=json.load(open('data/stations.json')); print(len(d['sources'].get('rtk2go',{}).get('stations',[])))")
            cp=$(python -c  "import json; d=json.load(open('data/stations.json')); print(len(d['sources'].get('centipede',{}).get('stations',[])))")
            git commit -m "chore(data): refresh NTRIP stations (${rtk} rtk2go, ${cp} centipede)"
          fi

          # Push with rebase-retry: a human PR merge or another run can
          # land on the branch between our checkout and our push. Rebase
          # our data-only commit onto the latest head and try again.
          for attempt in 1 2 3; do
            if git push origin HEAD:${GITHUB_REF_NAME}; then
              echo "Push succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}; rebasing on latest ${GITHUB_REF_NAME}…"
            git fetch origin ${GITHUB_REF_NAME}
            git rebase origin/${GITHUB_REF_NAME}
            sleep $((attempt * 2))
          done
          echo "Failed to push after 3 attempts."
          exit 1
