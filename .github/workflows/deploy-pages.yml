name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "guide.html"
      - "robots.txt"
      - "sitemap.xml"
      - "og-preview.png"
      - "data/*.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_run:
    workflows: ["Update NTRIP station data"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Stage site
        run: |
          set -euo pipefail
          mkdir -p _site/data
          cp index.html guide.html robots.txt sitemap.xml og-preview.png _site/
          cp data/stations.json data/source_health.json \
             data/country_markers.json data/help_topics.json _site/data/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy _site --project-name=ntrip-mountpoint-map --branch=main
